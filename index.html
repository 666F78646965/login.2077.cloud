    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Share Tech Mono"', 'monospace'],

    <style>
        body {
            background-color: #030308;
            color: #00f0ff;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }
        
        /* CRT Scanlines and Flicker */
        .scanlines {
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Neon Glows */
        .glow-text {
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.4);
        }
        
        .glow-box {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .glow-box:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.2);
        }

        /* Blinking cursor */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00f0ff;
            vertical-align: middle;
            animation: blink 1s infinite;
            box-shadow: 0 0 8px #00f0ff;
        }

        /* Frosted Glass Neon Button Effect */
        .glass-btn {
            background: rgba(10, 15, 30, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .glass-btn:hover {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 relative selection:bg-cybercyan selection:text-black">

    <div class="fixed inset-0 scanlines z-50"></div>

        <div id="button-container" class="w-full flex flex-col gap-4">

                <div class="flex items-center gap-4 pointer-events-none">
                    <i class="fa-brands fa-apple text-2xl group-hover:scale-110 transition-transform"></i>

                <i class="fa-solid fa-chevron-right text-xs opacity-60 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>
            </a>

            <a href="https://2.2077.cloud" class="glass-btn tilt-card relative group w-full py-4 px-6 rounded-xl flex items-center justify-between text-cybercyan font-bold tracking-wider transition-all duration-200">
                <div class="flex items-center gap-4 pointer-events-none">
                    <i class="fa-brands fa-x-twitter text-2xl group-hover:scale-110 transition-transform"></i>
                    <span class="text-sm sm:text-base">Login with X</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs opacity-60 group-hover:opacity-100 group-hover:translate-x-1 transition-all"></i>

                <div class="flex items-center gap-4 pointer-events-none">

                    <span class="text-sm sm:text-base">Login with Google</span>
                </div>

                <div class="flex items-center gap-4 pointer-events-none">

        STATUS: ENCRYPTED // NODE_ID: #77X-ALPHA
    </footer>

    <script>
        // Typewriter Effect for Top-Left Header
        const targetText = "login.2077.cloud";
        const typewriterElement = document.getElementById("typewriter-text");
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < targetText.length) {
                typewriterElement.textContent += targetText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 80 + Math.random() * 60);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeWriter, 300);
        });

        // 3D Tilt Effect for Frosted Glass Buttons (Mouse & Touch compatible)
        const cards = document.querySelectorAll('.tilt-card');

        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; //x position within card
                const y = e.clientY - rect.top;  //y position within card

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = ((y - centerY) / centerY) * -10; // Max tilt deg
                const rotateY = ((x - centerX) / centerX) * 10;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
            });

            // Touch support for mobile interaction feedback
            card.addEventListener('touchstart', (e) => {
                card.style.transform = 'perspective(1000px) scale3d(0.98, 0.98, 0.98)';
            }, { passive: true });

            card.addEventListener('touchend', () => {
                card.style.transform = 'perspective(1000px) scale3d(1, 1, 1)';
            }, { passive: true });
        });
    </script>
</body>
